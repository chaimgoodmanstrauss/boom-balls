<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Boom Balls</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boom Balls">
<style>
  html, body { margin: 0; height: 100%; background: #001a1a; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-text-size-adjust: 100%; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none;
         font: 13px/1.3 system-ui, sans-serif; color: #7fbfbf; }
  canvas { display: block; cursor: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #bar { position: fixed; top: 10px; right: 12px; display: flex; gap: 8px; }
  #bar button { background: rgba(0,26,26,.6); border: 1px solid #336666; color: #7fbfbf; border-radius: 4px;
                padding: 3px 8px; cursor: pointer; font: inherit; }
  #fsx { display: none; position: fixed; top: 10px; right: 12px; background: rgba(0,26,26,.4); border: 1px solid #224444;
         color: #5f9f9f; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  :fullscreen #bar, :fullscreen #hint { display: none; }
  @media (pointer: coarse) { :fullscreen #fsx { display: block; } } /* touch: no keyboard, so a small exit button */
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
          transition: opacity 1s; padding: 0 12px; }
  /* phones / touch screens: bigger controls and text, clear of the notch and home bar */
  @media (pointer: coarse) {
    body { font-size: 17px; }
    #bar { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
    #bar button { padding: 10px 16px; border-radius: 8px; }
    #hint { bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
  @media (pointer: coarse) { .keys { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"><button id="fs" title="Full screen (F); W or X to exit">full screen</button><button id="snd" title="Toggle sound (S)">sound: on</button></div>
<button id="fsx" title="Exit full screen">✕</button>
<div id="hint">Tap a ball to set it off (drag on to set off more). Drag on empty space to swish the balls around.<span class="keys"> Space pauses.</span></div>
<script>
// Port of the 2007 Processing sketch "boom" (boom.pde + balls.pde).
// Constants keep the original's integer-division values (e.g. 70/30 = 2).
// The field fills the window; its shorter side is 600 units (the original's size),
// and the ball count scales with area to keep the original density of 120 per 600x600.
const baseSize = 600, baseBalls = 120, framepersec = 30, minScale = 1.3;
let winx = baseSize, winy = baseSize, numBalls = baseBalls;
const minBallSpeed = 0, maxBallSpeed = 2, growthSpeed = 1.5, shrinkSpeed = 4;
const normalBallSize = 10, maxBallSize = 50, minBallSize = 5;
const collisionsQ = true, chainReactionQ = true, spontaneousCombustionQ = true, reentryQ = true;
const holdOffOnSpontaneousCombustionAfterClickQ = true, onlyOneCombustionAtATimeQ = true;
const holdOffFor = 300, keepMovingQ = true, bumpWait = 10;
// swish (new): a drag on empty space acts like a paddle in a fluid
const swishRadius = 45, swishPush = 0.15, swishSteer = 0.05, swishDecay = 0.97, swishMax = 20;
const explodeAlpha = 0.55, emberShade = 0.6; // opacity at full explosion radius; ember brightness (new)
const smashSpeed = 5; // closing speed that sets two colliding balls off (unswished max is 4)

let combustingQ = spontaneousCombustionQ, holdCheck = 0, check = 0;
const rand = (a, b) => a + Math.random() * (b - a);

function hslRgb(h, l) { // saturation 100%; h in degrees, l in 0..1 -> [r,g,b] 0..255
  const f = n => { const k = (n + h / 30) % 12; return 255 * (l - Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
function randomColor() { // HSB: hue 0–.25 (red→yellow-green), sat .85–.98, bright 1
  const h = rand(0, 90), l = (2 - rand(.85, .98)) / 2;
  const base = hslRgb(h, l);
  return { base,
           light: hslRgb(h, Math.min(l + .18, .88)),  // look at full explosion radius
           ember: base.map(c => c * emberShade) };    // burnt-out look
}
const lerp = (a, b, t) => a + (b - a) * t;
function rgba(c1, c2, t, a) {
  return `rgba(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))},${a})`;
}

class Ball {
  constructor() {
    this.x = rand(normalBallSize, winx - normalBallSize);
    this.y = rand(normalBallSize, winy - normalBallSize);
    const ang = rand(0, 6.29), speed = rand(minBallSpeed, maxBallSpeed);
    this.dx = speed * Math.cos(ang); this.dy = speed * Math.sin(ang);
    this.setBall();
  }
  setBall() { this.bx = 0; this.by = 0; this.ss = normalBallSize; this.pal = randomColor(); this.col = rgba(this.pal.base, this.pal.base, 0, 1); this.alph = 100; this.state = 0; }
  resetBall() { // send a ball in from a side
    let ang = 0;
    switch (Math.floor(rand(0, 3.999))) {
      case 0: this.x = -normalBallSize; this.y = rand(3*normalBallSize, winy - 3*normalBallSize); ang = rand(-1.4, 1.4); break;
      case 1: this.x = winx + normalBallSize; this.y = rand(3*normalBallSize, winy - 3*normalBallSize); ang = rand(-1.4, 1.4) + Math.PI; break;
      case 2: this.y = -normalBallSize; this.x = rand(3*normalBallSize, winx - 3*normalBallSize); ang = rand(-1.4, 1.4) + Math.PI*3/2; break;
      case 3: this.y = winy + normalBallSize; this.x = rand(3*normalBallSize, winx - 3*normalBallSize); ang = rand(-1.4, 1.4) + Math.PI/2; break;
    }
    this.dx = maxBallSpeed * Math.cos(ang); this.dy = maxBallSpeed * Math.sin(ang);
    this.setBall();
  }
  move() { if (keepMovingQ) { this.x += this.dx; this.y += this.dy; } }
  drift() { // swish: extra flow velocity on top of the original physics, decays each frame
    if (this.bx === 0 && this.by === 0) return;
    if (this.state === 0) {
      if (this.x <= this.ss && this.bx < 0) this.bx = -this.bx;
      if (this.y <= this.ss && this.by < 0) this.by = -this.by;
      if (this.x >= winx - this.ss && this.bx > 0) this.bx = -this.bx;
      if (this.y >= winy - this.ss && this.by > 0) this.by = -this.by;
    }
    this.x += this.bx; this.y += this.by;
    this.bx *= swishDecay; this.by *= swishDecay;
    if (Math.abs(this.bx) + Math.abs(this.by) < .01) this.bx = this.by = 0;
  }
  update() {
    this.drift();
    switch (this.state) {
      case 0: {
        if (this.x <= this.ss && this.dx < 0) this.dx = -this.dx;
        if (this.y <= this.ss && this.dy < 0) this.dy = -this.dy;
        if (this.x >= winx - this.ss && this.dx > 0) this.dx = -this.dx;
        if (this.y >= winy - this.ss && this.dy > 0) this.dy = -this.dy;
        const dd = Math.hypot(this.dx, this.dy);
        if (dd > maxBallSpeed) { this.dx *= maxBallSpeed / dd; this.dy *= maxBallSpeed / dd; }
        this.x += this.dx; this.y += this.dy;
        if (combustingQ && Math.random() < .0002) { this.state = 1; playGrow(); }
        break;
      }
      case 1: this.ss += growthSpeed; this.alph += 2*growthSpeed; this.move(); if (this.ss >= maxBallSize) this.state = 2; break;
      case 2: this.ss -= shrinkSpeed; this.alph += shrinkSpeed; this.move(); if (this.ss <= minBallSize) this.state = 3; break;
      case 3: this.alph++; this.move(); if (this.alph > 255) this.state = 4; break;
      case 4: if (reentryQ && Math.random() < .005) this.resetBall(); break;
    }
  }
  display() {
    if (this.state > 3) return;
    const P = this.pal, A = this.ss * this.ss;
    if (this.state === 1) { // growing: ramp by area from the ball's colour to the light, see-through look
      const t = Math.max(0, Math.min(1, (A - normalBallSize ** 2) / (maxBallSize ** 2 - normalBallSize ** 2)));
      ctx.fillStyle = rgba(P.base, P.light, t, lerp(1, explodeAlpha, t));
    } else if (this.state === 2) { // shrinking: ramp by area from the full-radius look to the ember
      const t = Math.max(0, Math.min(1, (A - minBallSize ** 2) / (maxBallSize ** 2 - minBallSize ** 2)));
      ctx.fillStyle = rgba(P.ember, P.light, t, lerp(1, explodeAlpha, t));
    } else if (this.state === 3) ctx.fillStyle = rgba(P.ember, P.ember, 0, 1);
    else ctx.fillStyle = this.col;
    ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0, Math.trunc(this.ss)), 0, 2*Math.PI); ctx.fill();
  }
}

let balls = [], bumpCounter = [];
function syncBalls(fx, fy) { // match ball count to field area; stretch positions to the new field
  numBalls = Math.max(1, Math.round(baseBalls * winx * winy / (baseSize * baseSize)));
  if (balls.length > numBalls) { // drop burnt-out balls first
    balls.sort((a, b) => (b.state === 4) - (a.state === 4));
    balls = balls.slice(balls.length - numBalls);
  }
  for (const b of balls) { b.x *= fx; b.y *= fy; }
  while (balls.length < numBalls) balls.push(new Ball());
  for (const b of balls) if (b.state === 0) {
    b.x = Math.min(Math.max(b.x, b.ss), winx - b.ss);
    b.y = Math.min(Math.max(b.y, b.ss), winy - b.ss);
  }
  bumpCounter = Array.from({ length: numBalls }, () => new Int16Array(numBalls));
}

function collide() {
  const xV = new Float64Array(numBalls), yV = new Float64Array(numBalls);
  let doBump = false, doGrow = false;
  for (let i = 0; i < numBalls; i++) for (let j = i + 1; j < numBalls; j++) {
    const a = balls[i], b = balls[j];
    if (bumpCounter[i][j]) bumpCounter[i][j]--;
    const dX = a.x - b.x, dY = a.y - b.y, dd = dX*dX + dY*dY;
    const sss = (a.ss + b.ss) ** 2;
    if (collisionsQ && a.state === 0 && b.state === 0 && dd > 0 && dd <= sss) {
      // smash (new): closing speed, including swish drift, above smashSpeed sets both off
      const closing = -((a.dx + a.bx - b.dx - b.bx) * dX + (a.dy + a.by - b.dy - b.by) * dY) / Math.sqrt(dd);
      if (closing > smashSpeed) { // both go off and share momentum (equal masses stick together)
        a.dx = b.dx = (a.dx + b.dx) / 2; a.dy = b.dy = (a.dy + b.dy) / 2; // steady drift, as in the original
        a.bx = b.bx = (a.bx + b.bx) / 2; a.by = b.by = (a.by + b.by) / 2; // swish part, still decays
        a.state = 1; b.state = 1; doGrow = true; continue;
      }
      const tt = -((a.dx - b.dx) * dX + (a.dy - b.dy) * dY) / dd;
      if (tt > 0) {
        xV[i] += tt*dX; xV[j] -= tt*dX; yV[i] += tt*dY; yV[j] -= tt*dY;
        if (!bumpCounter[i][j]) { doBump = true; bumpCounter[i][j] = bumpWait; }
      }
    }
    const ignite = (src, dst) => {
      if (chainReactionQ && (src.state === 1 || src.state === 2) && dst.state === 0 && dd <= sss) {
        dst.state = 1; doGrow = true;
        if ((holdOffOnSpontaneousCombustionAfterClickQ && !combustingQ) || onlyOneCombustionAtATimeQ) holdCheck = check;
      }
    };
    ignite(a, b); ignite(b, a);
  }
  if (doBump) playBump();
  if (doGrow) playGrow();
  for (let i = 0; i < numBalls; i++) { balls[i].dx += xV[i]; balls[i].dy += yV[i]; }
}

// ---- drawing / timing ----
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const w = innerWidth, h = innerHeight, dpr = devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  // CSS px per field unit; never below minScale so balls stay big on phones (iPhone: ~2x the old size)
  scale = Math.max(Math.min(w, h) / baseSize, minScale);
  const ox = winx, oy = winy;
  winx = w / scale; winy = h / scale;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  syncBalls(winx / ox, winy / oy);
}
addEventListener('resize', resize); resize();

function step() {
  check++;
  if (spontaneousCombustionQ && !combustingQ && check >= holdCheck + holdOffFor) combustingQ = true;
  collide();
  for (const b of balls) b.update();
  paddleFrame();
}
function render() {
  ctx.fillStyle = '#003333'; ctx.fillRect(0, 0, winx, winy);
  for (const b of balls) b.display();
  for (const p of paddles.values()) drawPaddle(p);
}
// ---- rendered cursor: a shallow C-shaped paddle seen from above, hollow facing its motion ----
const paddles = new Map(); // pointerId -> { x, y, vx, vy, ang, down }
const paddleR = 30, paddleHalf = 0.6, paddleW = 3.5; // arc radius, half-angle, stroke: ~34-unit chord, ~5-unit dip
const paddleBounce = 0.8; // restitution when a ball hits the paddle
function movePaddle(id, x, y, down) {
  let p = paddles.get(id);
  if (!p) { p = { x, y, vx: 0, vy: 0, fx: 0, fy: 0, lx: x, ly: y, ang: -Math.PI / 2, down }; paddles.set(id, p); }
  p.vx = p.vx * 0.7 + (x - p.x) * 0.3; p.vy = p.vy * 0.7 + (y - p.y) * 0.3; // smoothed heading
  if (Math.hypot(p.vx, p.vy) > 0.4) p.ang = Math.atan2(p.vy, p.vx);           // keep last heading when still
  p.down = down;
  p.solid = down && pointers.get(id)?.mode === 'swish';
  // sweep in small steps so a fast paddle can't pass through a ball
  const x0 = p.x, y0 = p.y, n = p.solid ? Math.max(1, Math.ceil(Math.hypot(x - x0, y - y0) / 3)) : 1;
  for (let k = 1; k <= n; k++) {
    p.x = x0 + (x - x0) * k / n; p.y = y0 + (y - y0) * k / n;
    if (p.solid) paddleHit(p);
  }
}
function paddleFrame() { // per sim frame: paddle velocity, and balls running into a still paddle
  for (const p of paddles.values()) {
    p.fx = p.x - p.lx; p.fy = p.y - p.ly; p.lx = p.x; p.ly = p.y;
    if (p.solid) paddleHit(p);
  }
}
function paddleHit(p) { // solid paddle: push balls out of the arc and bounce them off it
  const cx = p.x + Math.cos(p.ang) * paddleR, cy = p.y + Math.sin(p.ang) * paddleR, mid = p.ang + Math.PI;
  for (const b of balls) {
    if (b.state !== 0) continue;
    let a = Math.atan2(b.y - cy, b.x - cx) - mid;
    a = Math.max(-paddleHalf, Math.min(paddleHalf, Math.atan2(Math.sin(a), Math.cos(a))));
    const qx = cx + Math.cos(mid + a) * paddleR, qy = cy + Math.sin(mid + a) * paddleR; // nearest arc point
    const ex = b.x - qx, ey = b.y - qy, d = Math.hypot(ex, ey), reach = b.ss + paddleW / 2;
    if (d >= reach || d === 0) continue;
    const nx = ex / d, ny = ey / d;
    b.x = qx + nx * reach; b.y = qy + ny * reach;
    const rel = (b.dx + b.bx - p.fx) * nx + (b.dy + b.by - p.fy) * ny; // approach speed vs the paddle
    if (rel < 0) {
      const j = -(1 + paddleBounce) * rel;
      b.bx += j * nx; b.by += j * ny;
      const m = Math.hypot(b.bx, b.by);
      if (m > swishMax) { b.bx *= swishMax / m; b.by *= swishMax / m; }
      if (bumpReady(p)) playBump();
    }
  }
}
let lastPaddleBump = 0;
function bumpReady() { if (check - lastPaddleBump < 3) return false; lastPaddleBump = check; return true; }
function drawPaddle(p) {
  const cx = p.x + Math.cos(p.ang) * paddleR, cy = p.y + Math.sin(p.ang) * paddleR; // circle centre ahead
  ctx.beginPath();
  ctx.arc(cx, cy, paddleR, p.ang + Math.PI - paddleHalf, p.ang + Math.PI + paddleHalf);
  ctx.lineCap = 'round';
  ctx.lineWidth = paddleW; ctx.strokeStyle = p.down ? 'rgb(235,250,250)' : 'rgba(200,235,235,0.25)';
  ctx.stroke();
}
let paused = false, last = performance.now(), acc = 0;
const dt = 1000 / framepersec;
function frame(now) {
  acc += Math.min(now - last, 250); last = now;
  if (!paused) while (acc >= dt) { step(); acc -= dt; } else acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- mouse / touch (multi-touch: each pointer is its own igniter or paddle) ----
const pointers = new Map(); // pointerId -> { mode: 'ignite' | 'swish', x, y }
function toSim(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale];
}
const slop = e => e.pointerType === 'touch' ? 12 : 5; // fingers get a bigger target
function hitsBall(mx, my, pad) {
  return balls.some(b => b.state === 0 && (mx - b.x) ** 2 + (my - b.y) ** 2 <= (b.ss + pad) ** 2);
}
function doMouseDown(mx, my, pad) {
  for (const b of balls) {
    if ((mx - b.x) ** 2 + (my - b.y) ** 2 <= (b.ss + pad) ** 2 && b.state === 0) { b.state = 1; playGrow(); }
  }
  holdCheck = check;
  if (holdOffOnSpontaneousCombustionAfterClickQ) combustingQ = false;
}
function swish(x0, y0, x1, y1) {
  const vx = x1 - x0, vy = y1 - y0, L2 = vx*vx + vy*vy;
  if (L2 === 0) return;
  for (const b of balls) {
    if (b.state > 3) continue;
    const t = Math.max(0, Math.min(1, ((b.x - x0) * vx + (b.y - y0) * vy) / L2));
    const d = Math.hypot(b.x - (x0 + t*vx), b.y - (y0 + t*vy));
    if (d >= swishRadius + b.ss) continue;
    const w = (1 - d / (swishRadius + b.ss)) ** 2;
    b.bx += vx * w * swishPush; b.by += vy * w * swishPush;
    const m = Math.hypot(b.bx, b.by);
    if (m > swishMax) { b.bx *= swishMax / m; b.by *= swishMax / m; }
    b.dx += vx * w * swishSteer; b.dy += vy * w * swishSteer; // re-aims; still capped at maxBallSpeed
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId); unlockAudio(); hideHint();
  const [x, y] = toSim(e), pad = slop(e);
  const mode = hitsBall(x, y, pad) ? 'ignite' : 'swish';
  pointers.set(e.pointerId, { mode, x, y, pad });
  movePaddle(e.pointerId, x, y, true);
  if (mode === 'ignite') doMouseDown(x, y, pad);
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  const [x, y] = toSim(e);
  if (e.pointerType === 'mouse' || p) movePaddle(e.pointerId, x, y, !!p); // mouse paddle shows while hovering
  if (!p) return;
  if (p.mode === 'ignite') doMouseDown(x, y, p.pad); else swish(p.x, p.y, x, y);
  p.x = x; p.y = y;
});
const lift = e => {
  pointers.delete(e.pointerId);
  if (e.pointerType === 'mouse') { const q = paddles.get(e.pointerId); if (q) q.down = false; }
  else paddles.delete(e.pointerId); // fingers: paddle vanishes when lifted
};
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pointers.has(e.pointerId)) paddles.delete(e.pointerId); });
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (e.key === 'f' || e.key === 'F') enterFull();
  else if ('wWxX'.includes(e.key) && e.key.length === 1) exitFull();
});
const hint = document.getElementById('hint');
function hideHint() { hint.style.opacity = 0; }
setTimeout(hideHint, 8000);

// ---- sound (bonk0-1 for bumps, swirl0-8 for ignitions, as in the original) ----
let actx = null, soundOn = true;
const bumpBufs = [], growBufs = [];
['touchend', 'click'].forEach(t => addEventListener(t, () => unlockAudio(), { passive: true }));
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const load = (name, arr, i) => fetch('sounds/' + name).then(r => r.arrayBuffer())
    .then(buf => actx.decodeAudioData(buf)).then(d => { arr[i] = d; }).catch(() => {});
  for (let i = 0; i < 2; i++) load(`bonk${i}.mp3`, bumpBufs, i);
  for (let i = 0; i < 9; i++) load(`swirl${i}.mp3`, growBufs, i);
}
function play(arr, n) {
  if (!soundOn || !actx) return;
  const buf = arr[Math.floor(Math.random() * n)];
  if (!buf) return;
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); src.start();
}
const playBump = () => play(bumpBufs, 2), playGrow = () => play(growBufs, 9);
const sndBtn = document.getElementById('snd');
function toggleSound() { soundOn = !soundOn; sndBtn.textContent = 'sound: ' + (soundOn ? 'on' : 'off'); if (soundOn) unlockAudio(); }
sndBtn.addEventListener('click', () => { toggleSound(); sndBtn.blur(); });

// ---- full screen: button or F to enter; W or X (or Esc) to exit ----
const de = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function enterFull() {
  if (fsEl()) return;
  (de.requestFullscreen || de.webkitRequestFullscreen)?.call(de)?.catch?.(() => {});
}
function exitFull() {
  if (!fsEl()) return;
  (document.exitFullscreen || document.webkitExitFullscreen)?.call(document)?.catch?.(() => {});
}
const fsBtn = document.getElementById('fs');
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.style.display = 'none'; // e.g. iPhone Safari
fsBtn.addEventListener('click', () => { enterFull(); fsBtn.blur(); });
document.getElementById('fsx').addEventListener('click', exitFull);
['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, () => { if (fsEl()) hideHint(); }));
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
